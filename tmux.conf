# ── Prefix ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 50
set -g default-terminal "tmux-256color"

# Ghostty true color + extended keys (Shift+Enter etc for Claude Code)
set -as terminal-features ",xterm-ghostty:RGB"
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# ── Splits (open in current pane's directory) ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind _ split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
unbind '"'
unbind %

# ── Splits without prefix ──
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-C-v split-window -h -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind -n M-C-s split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"

# ── Pane titles (pane_title is app-controlled, Claude Code stomps it, so we use @paneName instead) ──
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{?#{@paneName},#{@paneName},#{pane_title}} "
set -g pane-active-border-style "fg=magenta"
bind N command-prompt -p "pane name:" "set -p @paneName '%%'"
bind -T root DoubleClick1Border command-prompt -p "pane name:" "set -p @paneName '%%'"

# ── Pane bar clicks: select / rename / kill, routed by whether the click hit a pane range or a window range ──
bind -T root MouseDown1Status if-shell -F "#{==:#{mouse_status_range},pane}" { select-pane -t = } { switch-client -t = }
bind -T root DoubleClick1Status if-shell -F "#{==:#{mouse_status_range},pane}" { command-prompt -I "#{@paneName}" -p "pane name:" { set -p @paneName "%%" } } { command-prompt -I "#{window_name}" -p "window name:" { rename-window "%%" } }
bind -T root MouseDown3Status if-shell -F "#{==:#{mouse_status_range},pane}" { confirm-before -p "kill pane #{pane_index}? (y/n)" { kill-pane -t = } } { display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window } }

# ── Pane navigation without prefix ──
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Window navigation ──
bind -n M-H previous-window
bind -n M-L next-window

bind T select-layout tiled
bind V select-layout even-vertical
bind -n M-t run-shell 'tmux display-message "theme: $(~/.local/bin/ghostty-theme-cycle)"; xdotool key --clearmodifiers ctrl+shift+comma'
bind -n M-T run-shell 'tmux display-message "theme: $(~/.local/bin/ghostty-theme-cycle --reverse)"; xdotool key --clearmodifiers ctrl+shift+comma'

# ── Second status line: clickable pane bar for the current window (left-click select, double-click rename, right-click kill) ──
set -g status 2
set -g status-format[1] "#[align=left]#{P:#[range=pane|#{pane_id}]#{?pane_active,#[fg=magenta bold],#[fg=colour245]} #{pane_index}:#{?#{@paneName},#{@paneName},#{pane_title}} #[norange default]}"

# ── Reload config ──
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar ──
set -g status-position top
set -g status-interval 5

# ── Plugins ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

run '~/.tmux/plugins/tpm/tpm'

# ── Window tabs show #W (user-set name), not catppuccin's default #T (app-controlled pane title) -- must load after the plugin above ──
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W#[fg=#181825,reverse]#[none]"
set -g window-status-current-format "#[fg=#11111b,bg=#{@thm_mauve}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_1}] #W#[fg=#181825,reverse]#[none]"
