# ── Prefix ──
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 50
set -g default-terminal "tmux-256color"

# Ghostty true color + extended keys (Shift+Enter etc for Claude Code)
set -as terminal-features ",xterm-ghostty:RGB"
set -g extended-keys on
set -as terminal-features ",xterm-ghostty:extkeys"

# ── Splits (open in current pane's directory) ──
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind _ split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
unbind '"'
unbind %

# ── Splits without prefix ──
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-C-v split-window -h -c "#{pane_current_path}" "claude" \; select-pane -T "claude"
bind -n M-C-s split-window -v -c "#{pane_current_path}" "claude" \; select-pane -T "claude"

# ── Pane titles (pane_title is app-controlled, Claude Code stomps it, so we use @paneName instead) ──
set -g pane-border-status top
set -g pane-border-format "#[fg=white,bold] #{?#{@paneName},#{@paneName},#{pane_title}} "
set -g pane-active-border-style "fg=magenta"
set -g window-active-style "#{?@paneIdle,bg=#476268,bg=#{@thm_surface_0}}"
set -g window-style "#{?@paneIdle,bg=#35454f,bg=#{@thm_bg}}"
bind N command-prompt -p "pane name:" "set -p @paneName '%%'"
bind -T root DoubleClick1Border command-prompt -p "pane name:" "set -p @paneName '%%'"

# clicking an actual pane (not a bar pill) doesn't otherwise trigger a status refresh, so the bar's highlight would wait for the next 5s status-interval tick
bind -T root MouseDown1Pane select-pane -t = \; send-keys -M \; refresh-client -S

# ── Catch a drag release on any surface, not just the bar itself (pane content, pane border) ──
# gated on an active drag so an ordinary click doesn't pay for a script spawn every time
bind -T root MouseUp1Pane if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{window_id}' '#{session_name}' '#{client_name}'" }
bind -T root MouseUp1Border if-shell -F "#{||:#{@dragSourcePane},#{@dragSourceWin}}" { run-shell "~/.local/bin/tmux-bar-drag-commit '#{window_id}' '#{session_name}' '#{client_name}'" }

# ── Pane bar clicks: select / rename / kill, routed by whether the click hit a pane range or a window range ──
bind -T root MouseDown1Status if-shell -F "#{==:#{mouse_status_range},pane}" { select-pane -t = ; set -Fg @dragSourcePane "#{pane_id}" ; refresh-client -S } { switch-client -t = ; set -Fg @dragSourceWin "#{window_id}" ; refresh-client -S }
bind -T root DoubleClick1Status if-shell -F "#{==:#{mouse_status_range},pane}" { command-prompt -I "#{@paneName}" -p "pane name:" { set -p @paneName "%%" } } { command-prompt -I "#{window_name}" -p "window name:" { rename-window "%%" } }
bind -T root MouseDown3Status if-shell -F "#{==:#{mouse_status_range},pane}" { confirm-before -p "kill pane #{pane_index}? (y/n)" { kill-pane -t = } } { display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' Kill X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } Rename n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window } }

# ── Drag to reorder: both bars show a real insertion marker (left/right half of a pill = before/after it) ──
# dispatch on which drag is actually active, not on where the cursor currently is, otherwise straying onto the other bar mid-drag shows its marker too
# freeze rather than update the marker while hovering the other bar, since its x-columns don't correspond to this one's items
bind -T root MouseDrag1Status if-shell -F "#{&&:#{@dragSourcePane},#{!=:#{mouse_status_range},window}}" { run-shell "~/.local/bin/tmux-bar-drag-update /tmp/tmux-pane-bar-spans-'#{window_id}' /tmp/tmux-pane-bar-insert-'#{window_id}' '#{mouse_x}' @dragInsertBefore '#{client_name}' ~/.local/bin/tmux-pane-bar-move '#{window_id}' '#{@dragSourcePane}' @dragSourcePane" } { if-shell -F "#{&&:#{@dragSourceWin},#{!=:#{mouse_status_range},pane}}" { run-shell "~/.local/bin/tmux-bar-drag-update /tmp/tmux-window-bar-spans-'#{session_name}' /tmp/tmux-window-bar-insert-'#{session_name}' '#{mouse_x}' @dragInsertBeforeWin '#{client_name}' ~/.local/bin/tmux-window-bar-move '#{session_name}' '#{@dragSourceWin}' @dragSourceWin" } { } }
# drop always acts on the marker's last known position, not on wherever the release pixel happens to resolve to
bind -T root MouseDragEnd1Status run-shell "~/.local/bin/tmux-bar-drag-commit '#{window_id}' '#{session_name}' '#{client_name}'"

# ── Pane navigation without prefix ──
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ── Window navigation ──
bind -n M-H previous-window
bind -n M-L next-window

bind T select-layout tiled
bind V select-layout even-vertical
bind -n M-t run-shell 'tmux display-message "theme: $(~/.local/bin/ghostty-theme-cycle)"; xdotool key --clearmodifiers ctrl+shift+comma'
bind -n M-r run-shell 'tmux display-message "theme: $(~/.local/bin/ghostty-theme-cycle --reverse)"; xdotool key --clearmodifiers ctrl+shift+comma'

# ── Clickable window bar and pane bar (left-click select, double-click rename, right-click kill, drag to reorder with an insertion marker) ──
set -g status 4
set -g status-format[0] "#[align=left]#(~/.local/bin/tmux-window-bar #{session_name} #{@dragInsertBeforeWin})"
set -g status-format[1] ""
set -g status-format[2] "#[align=left]#(~/.local/bin/tmux-pane-bar #{window_id} #{@dragInsertBefore})"
set -g status-format[3] ""

# ── Reload config ──
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar ──
set -g status-position top
set -g status-interval 5

# ── Plugins ──
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'claude'
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-resurrect-save-panenames'
set -g @resurrect-hook-post-restore-all '~/.local/bin/tmux-resurrect-restore-panenames'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

run '~/.tmux/plugins/tpm/tpm'

# continuum's own save script is slow (~300ms) even to just check whether a save is due, so it runs on its own background timer instead of on every status redraw
run-shell 'pid_file=/tmp/tmux-continuum-loop.pid; if [ ! -f "$pid_file" ] || ! kill -0 "$(cat "$pid_file" 2>/dev/null)" 2>/dev/null; then setsid ~/.local/bin/tmux-continuum-loop > /dev/null 2>&1 < /dev/null & echo $! > "$pid_file"; fi'

# highlights panes/windows where a claude session has finished and is waiting for input
run-shell 'pid_file=/tmp/tmux-claude-idle-loop.pid; if [ ! -f "$pid_file" ] || ! kill -0 "$(cat "$pid_file" 2>/dev/null)" 2>/dev/null; then setsid ~/.local/bin/tmux-claude-idle-loop > /dev/null 2>&1 < /dev/null & echo $! > "$pid_file"; fi'

# ── status-left is empty since the window bar (status-format[0]) replaces the native window list entirely ──
set -g status-left ""

# idle-claude border colors match the bar's idle colors, placed after TPM since catppuccin resets pane-active-border-style on load
set -g pane-border-style "#{?@paneIdle,fg=#{@thm_mauve},fg=#{@thm_overlay_0}}"
set -g pane-active-border-style "#{?@paneIdle,fg=#ddc5fa,fg=magenta}"

# rename/kill prompts should cover the full bar row, catppuccin's default leaves fill=default which only highlights the text itself
set -g message-style "fg=#{@thm_sky} bg=#{@thm_mantle} fill=#{@thm_mantle}"
set -g message-command-style "fg=#{@thm_sky} bg=#{@thm_mantle} fill=#{@thm_mantle}"
